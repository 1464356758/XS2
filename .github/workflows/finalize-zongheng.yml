name: Finalize Zongheng study
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-zongheng.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == '1464356758/XS2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish research records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('project_config.json')
          cfg=json.loads(path.read_text(encoding='utf-8'))
          cfg['writing']['platform']='zongheng'
          path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 tools/online_state.py select-platform --platform zongheng
          python3 tools/online_state.py research --file 'drafts/纵横平台研究.json'
          python3 tools/online_state.py topics --file 'drafts/纵横选题候选.json'
          python3 tools/online_state.py validate-index
          python3 - <<'PY'
          import json
          from pathlib import Path
          wf=json.loads(Path('book/workflow.json').read_text(encoding='utf-8'))
          assert wf['platform']=='zongheng'
          assert wf['phase']=='WAITING_TOPIC'
          assert wf['selected_topic'] is None
          idx=json.loads(Path('online/index.json').read_text(encoding='utf-8'))
          assert len(idx['topics'])==8
          assert len(idx['research']['rank_samples'])>=15
          print('Confirmed:',wf['phase'],'topics',len(idx['topics']),'samples',len(idx['research']['rank_samples']))
          PY
          rm -f 'drafts/纵横平台研究.json' 'drafts/纵横选题候选.json'
          rmdir drafts || true
      - name: Commit atomic official state and index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          git commit -m 'Record Zongheng platform study and eight original topics'
          git push origin HEAD:main
