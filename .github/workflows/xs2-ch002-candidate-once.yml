name: XS2 CH002 candidate once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xs2-ch002-candidate-once.yml'
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assemble actual full draft and register V4.3 candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import novel_state as ns
          a=json.loads(Path('book/daily/active.json').read_text())
          s=ns.load_state('book')
          assert a['run_id']=='4b752a19c9dd403b9f68429d5e79ca09' and a['chapter']==2 and a['status']=='running'
          assert a['baseline_count']==1 and len(s['chapters'])==1 and s['revision']==4
          assert '2' in s['writing_briefs'] and '2' not in s['tasks']
          parts=['01','02','03','04','05','06','07','08','08b','09','10','11']
          text='\n\n'.join(Path(f'drafts/ch002_part{p}.txt').read_text(encoding='utf-8').strip() for p in parts)+'\n'
          count=ns.han_count(text)
          print('CH002_MEASURED_HAN='+str(count),'PARTS='+str(len(parts)))
          assert 8000<=count<=10000, 'full chapter length outside 8000-10000 Han'
          Path('drafts/CH002.txt').write_text(text,encoding='utf-8')
          PY
          python3 tools/novel_state.py --root book candidate --chapter 2 --text drafts/CH002.txt --reason '次章完整初稿：三盆试苗、村议限水、烧根损苗、三日检田'
          python3 tools/online_state.py task --phase REVIEWING --chapter 2 --detail '第二章已登记完整候选，三盆试验与损苗已成文，等待章后事实与V4.3审读；尚未采用。' --next '核对正文与前章、编制真实记录和release检查，通过后采用并完成本次daily run。'
          python3 tools/online_state.py validate-index
      - name: Commit candidate without touching frozen chapter
        run: |
          set -euo pipefail
          git rm .github/workflows/xs2-ch002-candidate-once.yml
          git rm drafts/ch002_part*.txt
          rm -f drafts/CH002.txt
          git add -A -- book/ online/
          git -c user.name='XS2 Daily Runner' -c user.email='xs2-daily-runner@users.noreply.github.com' commit -m 'daily: register full CH002 candidate with verified V4.3 brief'
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
