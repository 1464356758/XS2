name: Prepare first chapter candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-ch001.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == '1464356758/XS2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble authored draft and validate writing brief
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0,'tools')
          import novel_state as ns
          state=ns.read_json('book/state.json')
          assert state['revision']==3 and not state['chapters'] and not state['tasks']
          parts=['part01','part02','part02b','part03','part04','part05','part06','part07']
          fragments=[Path(f'drafts/ch001_{p}.txt').read_text(encoding='utf-8').strip() for p in parts]
          fragments[3]=fragments[3].replace('宁禾下山时，春日刚刚越过山脊。','宁禾走近村口时，春日刚刚越过山脊。',1)
          body='\n\n'.join(fragments)+'\n'
          count=ns.han_count(body)
          print('Complete CH001:',count,'Han, segments:',len(fragments))
          assert 8000<=count<=10000, 'chapter length outside specification'
          Path('drafts/CH001.txt').write_text(body,encoding='utf-8')
          PY
          python3 tools/novel_state.py --root book brief-request --out drafts/CH001_brief.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('drafts/CH001_brief.json')
          b=json.loads(p.read_text(encoding='utf-8'))
          b.update(
            decision='ready',
            writer_brief='在灰脉热患儿鲁小葵呼吸困难的夜晚开场，写五灵根杂役宁禾为了给三个危重病人求药，冒着误工与负债风险向照岚宗丹堂讨药，遭遇配额和禁药封田令，随后回到青石坳面对粮食与饮水分配的现实反对；他发现祖母废土旁一株野草尚活、旧骨砂或许能改变土壤，但知道苗龄和残煞必须验证，不强行救治；最后为保住试验可能性拒绝卖田，以押粮和工钱承受代价，并从旧土尺发现水向异常的疑点。紧贴宁禾有限视角，以动作、细节、对话推进，不上帝视角揭密。',
            reader_promise='第一章内体验救命压力、具体债务、宗门禁令、荒田出现可验证的微小希望；结尾形成药师试验与旧渠之谜两个后续问题，不承诺七日从种子长成仙药。',
            hard_boundaries=[
              '开篇宁禾十九岁，五灵根，炼气一层；不能凭灵力直接认定毒因，不能正面对抗筑基执事。',
              '青石坳灰脉热有三个危重病患，鲁小葵是其中之一；三株合格回青草最多缓解三名病患的急症，不能治愈全村。',
              '许青簪保留十二株已有苗龄的半成回青草，本章不得未经检验直接给病人使用，不得移栽或催熟。',
              '祖母一小坛熟骨砂只够一小畦；来源、残煞、水源与排水均须核实；不出现无限系统、神级传承或万能药。',
              '禁药封田令与宗门质检有真实公共安全理由，同时形成垄断；宁禾不可以一句道德宣言打败所有反对者。',
              '从开篇仲春初三子初起算，本章在首日夜晚结束；旧图与青灰渠水只是疑点，不能直接宣布幕后真凶。',
              '第1章800汉字内见病症与压力；3000汉字内让读者看见主角受到冲击及种田可能性。'
            ],
            history_queries=[],
            scene_plan=[
              {'purpose':'夜间药棚危机，确立三名危重者和七日时限，呈现宁禾救人的情感理由', 'target_han':1200},
              {'purpose':'山门求药遭遇配额、欠契、禁种告示，插入枯骨坡微弱复苏迹象', 'target_han':1600},
              {'purpose':'村口农人争水、药师的十二株半成苗与安全质疑形成有效对抗', 'target_han':1800},
              {'purpose':'祖屋土尺骨砂、部分对照观察、卖地抉择与不能冲下游的污染处理', 'target_han':2200},
              {'purpose':'药棚验样、病患与邻里回应、押粮与旧渠疑点，留下可核对的下一章工作', 'target_han':2200}
            ])
          p.write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 tools/novel_state.py --root book brief-check --file drafts/CH001_brief.json
          python3 tools/novel_state.py --root book context --profile writer --out drafts/CH001_writer_packet.md
          python3 tools/novel_state.py --root book candidate --chapter 1 --text drafts/CH001.txt --reason '第一章完整初稿：夜间求药、祖田微生机、押粮与旧水渠'
          python3 tools/online_state.py task --phase REVIEWING --chapter 1 --detail '第一章完整初稿已登记候选，等待证据审读和发布前检查；尚未定稿。' --next '核对本章全文，填写事实记录与release审查，通过后再采用。'
          python3 tools/online_state.py validate-index
          rm drafts/ch001_part*.txt drafts/CH001_writer_packet.md
      - name: Commit candidacy and synchronized project state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          git commit -m 'Register full CH001 candidate with V4.3 writing brief'
          git push origin HEAD:main
