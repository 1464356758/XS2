name: Register T03 novel planning
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-t03-plan.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  register:
    if: github.repository == '1464356758/XS2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Register chosen topic and immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          state=json.loads(Path('book/state.json').read_text(encoding='utf-8'))
          wf=json.loads(Path('book/workflow.json').read_text(encoding='utf-8'))
          assert wf['phase']=='WAITING_TOPIC' and wf['platform']=='zongheng' and wf['selected_topic'] is None
          assert state['revision']==0 and state['book_id']=='af52fe99-2c10-47f4-a08d-7d383173a212'
          assert not state['chapters'] and not state['tasks'] and not state['inputs']
          topics=json.loads(Path(wf['topics_path']).read_text(encoding='utf-8'))
          target=[x for x in topics['candidates'] if x['id']=='T03']
          assert len(target)==1
          print('T03 selected:',target[0]['title'])
          PY
          python3 tools/online_state.py select-topic --id T03 --request '我选择T03作为纵横中文网新小说的正式题材。请写入XS2仓库，按照V4.3规程先制定长篇大纲、人物设定和第一阶段路线，暂不写正文。'
          python3 tools/novel_state.py --root book set-input --kind canon --file drafts/T03_作者设定.md --reason '作者选择T03：登记基础世界观、人物关系及硬规则' --base-revision 1
          python3 tools/novel_state.py --root book set-input --kind roadmap --file drafts/T03_故事路线.md --reason '作者选择T03：登记100章十阶段大纲与第一阶段详细路线' --base-revision 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('project_config.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['project_name']='《凡人修仙：我把废灵田种成仙城》'
          data['writing']['genre']='凡人修仙＋灵田种植＋资源经营'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 tools/online_state.py task --phase PLANNING --detail 'T03已由作者正式选定；100章十阶段长纲、人物与世界硬规则、首十章路线均已登记。未生成任何小说正文。' --next '等待作者另行明确授权开始第1章；届时先生成写作任务书并执行V4.3审查。'
          python3 tools/online_state.py validate-index
          python3 tools/novel_state.py --root book status
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          state=json.loads(Path('book/state.json').read_text(encoding='utf-8'))
          wf=json.loads(Path('book/workflow.json').read_text(encoding='utf-8'))
          idx=json.loads(Path('online/index.json').read_text(encoding='utf-8'))
          assert state['book_id']==wf['book_id']==idx['book']['id']
          assert wf['selected_topic']['id']=='T03'
          assert wf['phase']==idx['task']['phase']=='PLANNING'
          assert state['title']==wf['selected_topic']['title']==idx['book']['title']
          assert set(state['inputs'])=={'canon','roadmap'}
          assert state['revision']==3 and not state['chapters'] and not state['tasks']
          assert idx['progress']['adopted_chapters']==0 and idx['book']['selected_topic_id']=='T03'
          for kind,item in state['inputs'].items():
              content=(Path('book')/item['path']).read_bytes()
              assert hashlib.sha256(content).hexdigest()==item['sha256'], kind
              assert len(content)>2000, kind
          assert idx['source']['state_revision']==state['revision']
          assert idx['source']['workflow_revision']==wf['revision']
          print('VALID: T03 PLANNING, rev',state['revision'],'chapter_count',len(state['chapters']))
          PY
          rm -f drafts/T03_作者设定.md drafts/T03_故事路线.md
          rmdir drafts || true
      - name: Commit state index and planning together
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          git diff --cached --stat
          git commit -m 'Select T03 and register V4.3 canon plus 100-chapter roadmap'
          git push origin HEAD:main
