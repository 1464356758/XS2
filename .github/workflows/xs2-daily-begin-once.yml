name: XS2 daily begin once
on:
  push:
    paths:
      - '.github/workflows/xs2-daily-begin-once.yml'
permissions:
  contents: write
jobs:
  begin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run actual daily begin
        run: |
          python3 tools/daily_update.py --project . begin | tee /tmp/xs2-daily-begin.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/xs2-daily-begin.json'))
          print('DAILY_ACTION='+data['action'])
          print('DAILY_RUN_ID='+str(data.get('run_id','')))
          print('DAILY_CHAPTER='+str(data.get('chapter','')))
          PY
      - name: Commit lock with non-force push and verify
        run: |
          set -euo pipefail
          git rm -- .github/workflows/xs2-daily-begin-once.yml
          if test -f book/daily/active.json; then git add book/daily/active.json; fi
          git -c user.name='XS2 Daily Runner' -c user.email='xs2-daily-runner@users.noreply.github.com' commit -m 'daily: persist XS2 execution lock and remove one-time runner'
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open('/tmp/xs2-daily-begin.json'))
          if x['action'] in ('started','resumed'):
              y=json.loads(Path('book/daily/active.json').read_text())
              assert x['run_id']==y['run_id'] and x['chapter']==y['chapter']
              assert x['baseline_fingerprint']==y['baseline_fingerprint']
              print('LOCK_COMMIT_READBACK_PASS')
          else:
              print('NO_NEW_LOCK_ACTION='+x['action'])
          PY
