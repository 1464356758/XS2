name: Novel task executor
on:
  push:
    paths:
      - '.automation/request.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: novel-task-executor-${{ github.repository }}
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TASK_BRANCH: ${{ github.event.repository.default_branch }}
      TASK_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute one bound request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/task_executor.py --event-sha "$TASK_SOURCE_SHA" --branch "$TASK_BRANCH"
      - name: Persist and read back without force
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(python3 - <<'PY'
          import json
          r=json.load(open('.automation/request.json'))
          print('.automation/results/'+r['request_id']+'.json')
          PY
          )"
          if ! test -f "$RESULT"; then
            echo 'Request was already recorded remotely; no replay.'
            exit 0
          fi
          python3 - <<'PY'
          import json,subprocess
          r=json.load(open('.automation/request.json'))
          result=json.load(open('.automation/results/'+r['request_id']+'.json'))
          paths=result['changed_paths']+['.automation/results/'+r['request_id']+'.json']
          subprocess.run(['git','add','-f','--',*paths],check=True)
          PY
          git fetch --quiet origin "$TASK_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$TASK_SOURCE_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'executor: persist verified tool result and synchronized index'
          git push origin "HEAD:refs/heads/$TASK_BRANCH"
          git fetch --quiet origin "$TASK_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          r=json.load(open('.automation/request.json'))
          p='.automation/results/'+r['request_id']+'.json'
          assert subprocess.check_output(['git','show','FETCH_HEAD:'+p])==Path(p).read_bytes()
          result=json.load(open(p))
          for path in result['changed_paths']:
              assert subprocess.check_output(['git','show','FETCH_HEAD:'+path])==Path(path).read_bytes(),path
          print('REMOTE_READBACK_VERIFIED',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
      - name: Expose actual tool failure
        shell: bash
        run: |
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          r=json.load(open('.automation/request.json'))
          p=Path('.automation/results')/(r['request_id']+'.json')
          if p.exists():
              result=json.loads(p.read_text())
              print('BUSINESS_STATUS='+result['business_status'])
              if result['executor_status']!='ok':sys.exit(1)
          PY
