name: Release reviewed chapter one
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-ch001.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: github.repository == '1464356758/XS2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind authored record, manual review and release evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import novel_state as ns
          state=ns.load_state('book')
          assert state['revision']==3 and not state['chapters']
          assert state['tasks']['1']['phase']=='candidate'
          candidate=state['tasks']['1']['candidate_path']
          text=Path('book',candidate).read_text(encoding='utf-8')
          assert ns.han_count(text)==8941
          record=json.loads(Path('editorial/CH001_record_authored.json').read_text(encoding='utf-8'))
          record.update(base_revision=state['revision'],canon_sha256=state['inputs']['canon']['sha256'],text_sha256=ns.digest(text))
          assert all(item['quote'] in text for item in record['facts']+record['thread_events'])
          Path('drafts').mkdir(exist_ok=True)
          Path('drafts/CH001_record.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Bound authored record with',len(record['facts']),'evidence-backed facts and',len(record['thread_events']),'promise events')
          PY
          CANDIDATE="$(python3 - <<'PY'
          import json
          print('book/'+json.load(open('book/state.json'))['tasks']['1']['candidate_path'])
          PY
          )"
          python3 tools/novel_state.py --root book check-record --text "$CANDIDATE" --record drafts/CH001_record.json
          python3 tools/novel_state.py --root book context --profile reader --text "$CANDIDATE" --out drafts/CH001_reader_packet.md
          python3 tools/novel_state.py --root book release-request --text "$CANDIDATE" --record drafts/CH001_record.json --out drafts/CH001_release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('drafts/CH001_release.json')
          r=json.loads(path.read_text(encoding='utf-8'))
          reviewed=json.loads(Path('editorial/CH001_release_authored.json').read_text(encoding='utf-8'))
          state=json.loads(Path('book/state.json').read_text(encoding='utf-8'))
          text=Path('book',state['tasks']['1']['candidate_path']).read_text(encoding='utf-8')
          sha=state['tasks']['1']['candidate_sha256']
          def ev(quote):
              if quote not in text: raise ValueError('Review quote not found in draft: '+quote)
              return {'chapter':1,'sha256':sha,'quote':quote}
          for key in ('decision','read_full_text','blocking_issues','reader_reason_to_continue','consequence','ending_runway','opening','future_window'):
              r[key]=reviewed[key]
          # Each checked item has an explicitly authored, distinct reason and original-text quote.
          r['checks']={key:{'decision':item['decision'],'conclusion':item['conclusion'],'evidence':[ev(item['quote'])]} for key,item in reviewed['checks'].items()}
          for item in r['promise_reviews']:
              decision=reviewed['promises'][item['id']]
              item.update(decision)
              item['evidence']=ev({'PR01':'七日内若找不到足够药性，最重的三个，我不敢替你们说一定熬得过去。',
                                   'PR02':'可它还活着。',
                                   'PR03':'“禁药封田令。”',
                                   'PR04':'但祖母后来用朱砂在粗线旁补了一个短短的箭头，反指枯骨坡。'}[item['id']])
          n=r['narrative_review']; author=reviewed['narrative_review']
          n['actual_scenes']=[{'event':x['event'],'choice':x['choice'],'change':x['change'],'evidence':[ev(x['quote'])]} for x in author['actual_scenes']]
          n['plan_comparison']=author['plan_comparison']
          reader=author['reader']
          n['reader'].update({key:reader[key] for key in ('mode','limitation','understanding','information_load','promise_delivery')})
          n['reader']['evidence']=[ev(reader['quote'])]
          n['reader']['issues']=[{'severity':x['severity'],'status':x['status'],'reason':x['reason'],'evidence':ev(x['quote'])} for x in reader['issues']]
          n['character_causality']={key:{'status':x['status'],'conclusion':x['conclusion'],'evidence':[ev(x['quote'])]} for key,x in author['character_causality'].items()}
          n['history']['queries']=author['history']['queries']
          n['history']['comparisons']=author['history']['comparisons']
          n['history']['no_match_reason']=author['history']['no_match_reason']
          n['reader_updates']=[{'kind':x['kind'],'statement':x['statement'],'evidence':[ev(x['quote'])]} for x in author['reader_updates']]
          n['reader_update_note']=author['reader_update_note']
          assert not n['surface_findings'], 'Unexpected production-language marker; stop for review'
          path.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('V4.3 authored narrative audit assembled; same-context limitation explicitly recorded')
          PY
          python3 tools/novel_state.py --root book release-check --text "$CANDIDATE" --record drafts/CH001_record.json --report drafts/CH001_release.json
          python3 tools/novel_state.py --root book adopt --text "$CANDIDATE" --record drafts/CH001_record.json
          python3 tools/novel_state.py --root book status
          python3 tools/online_state.py task --phase WAITING_NEXT --chapter 2 --detail '第1章《死苗与封条》8941汉字已完成V4.3检查并正式采用冻结，未登记纵横平台发布。' --next '收到作者下一章写作指令后，按已登记的canon、roadmap与前章冻结全文写第2章《十二株半死苗》。'
          python3 tools/online_state.py validate-index
      - name: Commit immutable chapter, record and release report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          git commit -m 'Adopt and freeze CH001 with complete V4.3 release review'
          git push origin HEAD:main
