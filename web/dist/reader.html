<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#183f36"><meta name="description" content="使用代发码读取正式小说章节，核验、复制并导出。"><title>续章 · 代发阅读</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./hub.css"></head><body class="partner-body"><header class="partner-header"><a class="brand dark-brand" href="./reader.html"><span class="brand-symbol">续</span><span>续章<small>CHAPTER DELIVERY</small></span></a><span class="partner-tag">代发阅读端</span></header><main class="partner-main"><section class="partner-intro"><span class="eyebrow">A STORY, READY TO SHARE</span><h1>下一章，交到你手中。</h1><p>输入作者提供的代发码，读取、核验并复制正式章节。</p></section><form class="code-form card" id="codeForm"><label for="partnerCode">小说代发码</label><div class="code-input-row"><input id="partnerCode" placeholder="NX1.…" autocomplete="off" spellcheck="false" required><button class="button primary" id="connectCode">读取小说 →</button></div><p class="field-help">代发码是公开仓库的编码定位信息，不包含登录凭证。</p></form><div id="partnerError" class="notice error" role="alert" hidden></div><section id="partnerBook" class="partner-book" hidden><div class="section-head"><div><span class="eyebrow">FORMAL CHAPTERS</span><h2 id="partnerTitle"></h2><p class="muted" id="partnerMeta"></p></div><button class="button outline" id="partnerRefresh">↻ 刷新目录</button></div><div class="notice" id="copyProgress">本机尚未记录复制进度。</div><div class="reading-layout partner-reading"><aside class="chapter-panel card"><label class="search-label" for="partnerChapterSearch">查找章节</label><div class="search-box"><input id="partnerChapterSearch" type="search" placeholder="章号或章节标题" maxlength="160" autocomplete="off" disabled><button class="search-clear" id="partnerChapterClear" type="button" aria-label="清除查找章节" hidden>清除</button></div><p class="search-summary" id="partnerChapterSearchStatus" role="status" aria-live="polite"></p><div class="chapter-list" id="partnerChapters"></div><p class="search-empty compact" id="partnerChapterEmpty" hidden>没有匹配章节，换个章号或标题试试。</p></aside><article class="reader-paper card"><div class="reader-controls"><button class="button ghost small" id="partnerPrev">← 上一章</button><button class="button ghost small" id="partnerNext">下一章 →</button></div><h2 id="partnerChapterTitle">选择章节</h2><p class="muted" id="partnerChapterStatus"></p><p class="field-help" id="partnerPublication"></p><div class="actions"><button class="button primary small" id="partnerCopyAll" disabled>复制标题＋正文</button><button class="button outline small" id="partnerCopyBody" disabled>只复制正文</button><button class="button ghost small" id="partnerExport" disabled>导出 TXT</button></div><pre class="chapter-text" id="partnerText"></pre></article></div></section><p class="partner-footnote">复制记录仅属于当前设备，不代表小说平台已经发布。换设备后请重新确认章号。</p></main><div class="toast" id="toast" role="status" aria-live="polite" hidden></div><script type="module" src="./reader.js"></script></body></html>
