name: Validate novel workspace
on:
  push:
    paths-ignore:
      - 'books.json'
      - 'reports/**'
      - 'snapshots/**'
  pull_request:
    paths-ignore:
      - 'books.json'
      - 'reports/**'
      - 'snapshots/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-private.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - name: Validate published index when initialized
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          import online_state
          if Path('book/state.json').exists():
              print(online_state.validate_index('.'))
          else:
              print('Empty initialization template; no book data yet.')
          PY
      - name: Test reader when included
        run: |
          node -e "const fs=require('fs');if(fs.existsSync('web/tests'))require('child_process').execFileSync(process.execPath,['--test',...fs.readdirSync('web/tests').filter(x=>x.endsWith('.test.mjs')).map(x=>'web/tests/'+x)],{stdio:'inherit'})"
