name: Initialize XS2 novel workspace
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-xs2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    if: github.repository == '1464356758/XS2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified V4.3 initialization package
        shell: bash
        run: |
          set -euo pipefail
          test ! -e book/state.json
          curl --fail --location --retry 3 --silent --show-error             'https://raw.githubusercontent.com/1464356758/xiaishuo-ZUOZONG/main/%E5%88%9D%E5%A7%8B%E5%8C%96%E7%B3%BB%E7%BB%9F%E5%8C%85.zip'             --output /tmp/novel-initialization.zip
          echo '9cbcf833878210635ccf91dfac1d8da453e108cfaa9a3e3a7cf27ff5fe8d429f  /tmp/novel-initialization.zip' | sha256sum -c -
          python3 -m zipfile -e /tmp/novel-initialization.zip .
          test -f AGENTS.md
          test -f tools/online_state.py
      - name: Bootstrap and validate new blank book
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/online_state.py bootstrap --repo https://github.com/1464356758/XS2 --branch main
          python3 tools/online_state.py validate-index
          python3 tools/novel_state.py --root book status
      - name: Commit initialized workspace as a single change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The Actions token cannot commit GitHub workflow files.
          # Keep the bootstrap workflow unchanged and commit the novel workspace.
          git add -A -- . ':!.github/workflows'
          git commit -m 'Initialize XS2 V4.3 novel workspace (awaiting platform)'
          git push origin HEAD:main